version: 2

project_name: vstodo

before:
  hooks:
    - go mod tidy

builds:
  - id: vstodo
    main: .
    binary: vstodo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  - id: vstodo-installer
    main: ./cmd/vstodo-installer
    binary: vstodo-installer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: default
    ids:
      - vstodo
      - vstodo-installer
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  - id: linux-packages
    package_name: vstodo
    ids:
      - vstodo
      - vstodo-installer
    vendor: SneppX
    homepage: https://github.com/SneppX/vstodo
    maintainer: SneppX
    description: An independent version control system with Git-compatible interoperability.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/vstodo/copyright
        type: license

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
